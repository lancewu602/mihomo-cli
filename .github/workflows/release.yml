name: release

# 推 v* tag → 在 macOS（arm64 / x86_64）与 Linux（x86_64）上各出两份二进制，
# 挂到该 tag 的 Release 上（目录版 tar.gz + 单文件，外加一份 SHA256SUMS）。
#
# 手动补发资产（比如 tag 早就打了、当时还没这个 workflow）：
#   Actions → release → Run workflow → 填已有 Release 的 tag（v0.1.0）
#
# 两个平台选择的理由（详见 docs/packaging.md）：
#   · Linux 固定 ubuntu-22.04：PyInstaller 产物绑构建机的 glibc，越老越能跑新的；
#     反过来会在更新的机器上报 GLIBC_2.xx not found。Alpine / musl 不行，那是另一套 libc。
#   · macOS 用 macos-14（Apple Silicon）与 macos-15-intel（Intel）：在哪种架构上构建就得到
#     哪种二进制，一个文件同时跑两种要 universal2 的 Python + spec 里 target_arch。
#     旧标签 macos-13 已于 2025-12-04 退役（用它只会永远排队，不报错）；macos-15-intel
#     是 Intel 的接替标签，官方说保留到 2027-08。
#   · 每个平台都出「目录版 + 单文件」：目录版启动快（默认推荐），单文件好拷贝但每次启动
#     都要解包（本机 macOS 26 实测 --help 6 秒 vs 0.1 秒，见 docs/packaging.md）。
#
# action 大版本必须是以 Node 24 为目标的那些：Node 20 已在 2026-04 EOL，runner 从
# 2026-06-16 起默认用 Node 24 跑 JS action（不报错，只在结尾给一条「被强制」的
# deprecation 警告），2026-09-23 起彻底移除 Node 20。别按「升到 v5 就好」的直觉改：
#   checkout v5 / setup-python v6 → using: node24
#   但 upload-artifact v5 与 download-artifact v5 仍然是 using: node20！
#   得 upload v6+ / download v7+ 才是 node24。
# 两个 artifact action 的大版本号本来就不一样（upload 最新 v7、download 最新 v8），
# 它们共用 v4 起的 artifact 服务接口，能配对工作（本 workflow 实跑验证过）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 Release 的 tag（手动补发资产时用；该 Release 不存在会自动创建）"
        required: true
        type: string
        default: "v0.1.0"

permissions:
  contents: write # gh release create / upload 要写权限

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # tag 推送时 github.event.inputs.tag 是空的，落到 ref_name（就是那个 tag）
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一个平台挂了，其余平台的产物照样出
      matrix:
        include:
          - os: macos-14
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: ubuntu-22.04
            asset: linux-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 运行时要的是 >=3.9；构建用的解释器随便挑个 PyInstaller 跟得上的版本就行，
          # 别拿 3.9 构建（没必要为下限牺牲构建环境）。
          python-version: "3.12"

      - name: 装 PyInstaller
        run: python -m pip install --upgrade 'pyinstaller>=6.0'

      # 目录版是默认产物：启动代价只付一次，之后与源码版一样快
      - name: 构建目录版
        run: pyinstaller --clean --noconfirm --distpath dist/dir --workpath build/dir mihomo-cli.spec
        env:
          MIHOMO_CLI_ONEDIR: "1"

      # 单文件版：好拷贝，代价是每次启动都要把归档解包成新的临时可执行文件
      - name: 构建单文件版
        run: pyinstaller --clean --noconfirm --distpath dist --workpath build mihomo-cli.spec

      - name: macOS ad-hoc 签名
        if: runner.os == 'macOS'
        # 本地自用不必签名，但挂上去给别人下载会被加 com.apple.quarantine，
        # 至少 ad-hoc 签一下（正式分发要 Developer ID + 公证，见 docs/packaging.md）。
        run: |
          codesign --force --sign - dist/dir/mihomo-cli/mihomo-cli
          codesign --force --sign - dist/mihomo-cli
          codesign --verify --verbose=2 dist/dir/mihomo-cli/mihomo-cli

      - name: 冒烟
        # 目标机器上只有这些二进制、没有 Python，所以这里只验它自己能起来
        run: |
          dist/dir/mihomo-cli/mihomo-cli --help > /dev/null
          dist/mihomo-cli --help > /dev/null
          file dist/dir/mihomo-cli/mihomo-cli dist/mihomo-cli

      - name: 打包
        run: |
          mkdir -p out
          # 目录版必须整目录打包：只拷那个可执行文件会缺 _internal/，跑不起来
          tar czf "out/mihomo-cli-${TAG}-${{ matrix.asset }}.tar.gz" -C dist/dir mihomo-cli
          cp dist/mihomo-cli "out/mihomo-cli-${TAG}-${{ matrix.asset }}-onefile"
          # 上传前先记下每个交付文件的 sha256：release job 下载后要拿它对一遍。
          # 为什么非要这一步：SHA256SUMS 是下载之后才算的，只能证明「下载后的文件自洽」，
          # 证明不了 artifact 往返没截断（有损的话它照样自洽）。
          mkdir -p out/hashes
          (cd out && sha256sum -- mihomo-cli-* > "hashes/${{ matrix.asset }}.sha256")
          cat "out/hashes/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          # 整个 out/ 一起传（含 hashes/ 子目录，那样下载侧才能还原出同名路径去对哈希）
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 挂到 Release (${{ github.event.inputs.tag || github.ref_name }})
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true # 三个平台的文件摊进同一个目录（子目录结构保留）

      - name: 对往返无损
        # 拿构建 job 上传前算好的 hashes/ 对下载后的文件重算一遍。过不了就红：
        # 宁可在这一步停下，也不能把可能已截断的文件当资产发出去。
        working-directory: assets
        run: |
          ls -R .
          sha256sum --check hashes/*.sha256

      - name: 生成校验和
        working-directory: assets
        run: |
          # 只写交付文件；hashes/ 是 CI 的中间产物，不发布
          sha256sum -- mihomo-cli-* > SHA256SUMS
          cat SHA256SUMS

      - name: 上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release 通常已经手动建好了（正文取自 CHANGELOG.md）；这里只补资产。
          # 没有就现建一个，正文用 GitHub 自动生成的（不读 CHANGELOG：这里没 checkout）。
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          # 显式列文件（别用 assets/*）：hashes/ 是中间产物，不能当资产发出去
          gh release upload "$TAG" assets/mihomo-cli-* assets/SHA256SUMS --clobber
